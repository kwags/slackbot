name: SAM Actions - Validate • Build
run-name: ${{ github.actor }} is validating and building Botdish 🤖

on:
  push:
    branches:
      - actions
  #pull_request:
  #  branches:
  #    - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --template-file template.yaml --region us-east-2
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pull ARM64 SAM build image
        run: docker pull public.ecr.aws/sam/build-python3.11:latest-arm64

      - name: Build SAM application
        run: sam build --use-container
        timeout-minutes: 5

      - run: echo "🍏 This job's status is ${{ job.status }}."
